# Run Craw Pro on your own computer:
#   1. copy .env.example to .env and fill in LLM_API_KEY
#   2. docker compose up -d --build
#   3. open http://localhost:8000
services:
  craw-pro:
    build:
      context: .
      args:
        # PyPI mirror for faster installs in mainland China; set to "" to use pypi.org
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: craw-pro:local
    container_name: craw-pro
    env_file: .env
    environment:
      PORT: "8000"
      DATA_DIR: /app/data
    ports:
      # Only reachable from this computer. Use "8000:8000" to open it to your local network.
      - "127.0.0.1:8000:8000"
    volumes:
      # Task history is kept in ./data on your computer and survives restarts and upgrades
      - ./data:/app/data
    restart: unless-stopped
