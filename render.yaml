services:
  - type: web
    name: craw-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Any OpenAI-compatible LLM (DeepSeek / Qwen / Kimi / GLM / OpenAI / OpenRouter ...)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MAX_PAGES_LIMIT
        value: "50"
